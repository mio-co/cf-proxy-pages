<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<title>反代后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23737373' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 3h5v5'/%3E%3Cpath d='M8 3H3v5'/%3E%3Cpath d='M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3'/%3E%3Cpath d='m15 9 6-6'/%3E%3C/svg%3E" />
<script>
  // 主题：跟随系统，手动切换后记在 localStorage（与 MioHub 一样用 .dark 类）
  (function () { var t = localStorage.getItem('theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); })();
</script>
<style>
  /* 配色与圆角取自 MioHub（shadcn-vue neutral） */
  :root {
    --radius: 0.625rem;
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0); --popover: oklch(1 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0); --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
    --ok: oklch(0.627 0.17 149); --warn: oklch(0.555 0.15 70); --warn-bg: oklch(0.769 0.165 70 / 8%);
    --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  }
  .dark {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0); --popover: oklch(0.205 0 0);
    --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%); --ring: oklch(0.556 0 0);
    --ok: oklch(0.723 0.19 149); --warn: oklch(0.828 0.15 80); --warn-bg: oklch(0.828 0.15 80 / 7%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body { margin: 0; min-width: 320px; overflow-x: clip; -webkit-text-size-adjust: 100%; }
  body { background: var(--background); color: var(--foreground); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; -webkit-font-smoothing: antialiased; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; pointer-events: none; }
  .mut { color: var(--muted-foreground); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tab { font-variant-numeric: tabular-nums; }

  /* 顶栏 */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; padding-top: env(safe-area-inset-top); box-sizing: content-box; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--background) 70%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  header .logo { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); }
  header .logo svg { width: 15px; height: 15px; }
  header h1 { font-size: 14px; font-weight: 500; margin: 0; white-space: nowrap; }
  .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
  header .who { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  header .acts { margin-left: auto; display: flex; gap: 4px; align-items: center; }

  main { max-width: 56rem; margin: 0 auto; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 768px) { main { padding: 32px 24px 48px; } }
  section { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .sh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .sub { margin: 4px 0 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: var(--muted-foreground); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--destructive); }

  /* 按钮（对应 buttonVariants） */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; border-radius: calc(var(--radius) - 2px); font: 500 14px/1 inherit; font-family: inherit; height: 36px; padding: 0 16px; border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground); cursor: pointer; transition: background .15s, color .15s, box-shadow .15s, opacity .15s; outline: none; flex-shrink: 0; text-decoration: none; }
  .btn:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
  .btn:focus-visible { box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); border-color: var(--ring); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .btn.outline { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: var(--shadow); }
  .dark .btn.outline { background: color-mix(in oklch, var(--input) 30%, transparent); border-color: var(--input); }
  .btn.outline:hover { background: var(--accent); }
  .dark .btn.outline:hover { background: color-mix(in oklch, var(--input) 50%, transparent); }
  .btn.ghost { background: transparent; color: var(--foreground); }
  .btn.ghost:hover { background: var(--accent); }
  .btn.destructive { background: var(--destructive); color: #fff; }
  .dark .btn.destructive { background: color-mix(in oklch, var(--destructive) 60%, transparent); }
  .btn.sm { height: 32px; padding: 0 12px; gap: 6px; }
  .btn.icon { width: 36px; padding: 0; } .btn.icon.sm { width: 32px; }
  .btn .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 输入框 */
  .input { width: 100%; height: 36px; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--input); background: transparent; color: var(--foreground); padding: 4px 12px; font: inherit; font-size: 14px; box-shadow: var(--shadow); outline: none; transition: box-shadow .15s, border-color .15s; min-width: 0; }
  .dark .input { background: color-mix(in oklch, var(--input) 30%, transparent); }
  .input::placeholder { color: var(--muted-foreground); }
  .input:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .input[aria-invalid=true] { border-color: var(--destructive); }
  label.lb { font-size: 14px; font-weight: 500; display: grid; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted-foreground); font-weight: 400; }

  /* Switch */
  .sw { position: relative; display: inline-flex; width: 32px; height: 18px; flex-shrink: 0; cursor: pointer; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--input); transition: background .15s; }
  .dark .sw span { background: color-mix(in oklch, var(--input) 80%, transparent); }
  .sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 99px; background: var(--background); transition: transform .15s; }
  .dark .sw span::after { background: var(--foreground); }
  .sw input:checked + span { background: var(--primary); }
  .sw input:checked + span::after { transform: translateX(14px); }
  .dark .sw input:checked + span::after { background: var(--primary-foreground); }
  .sw input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .swrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 14px; }

  /* 列表 */
  .list { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; min-height: 64px; }
  .item + .item { border-top: 1px solid var(--border); }
  .item .fav { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--muted); color: var(--muted-foreground); font-size: 13px; font-weight: 600; flex-shrink: 0; text-transform: uppercase; }
  .item .body { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .item .host { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .item .host b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 13px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .item .meta .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta svg { width: 13px; height: 13px; }
  .item.off .host b, .item.off .meta .t { opacity: .55; }
  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; border: 1px solid var(--border); padding: 0 6px; height: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--muted-foreground); flex-shrink: 0; }
  .badge.warn { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 30%, transparent); background: var(--warn-bg); }
  .badge.bad { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 30%, transparent); }
  .item .side { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

  /* 空状态 / 骨架 / 提示 */
  .empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 48px 24px; border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty .ico { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--muted); color: var(--foreground); margin-bottom: 4px; }
  .empty h3 { margin: 0; font-size: 16px; font-weight: 500; } .empty p { margin: 0; font-size: 14px; max-width: 26rem; }
  .sk { background: var(--muted); border-radius: 6px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .alert { display: flex; gap: 8px; align-items: flex-start; border-radius: calc(var(--radius) - 2px); border: 1px solid color-mix(in oklch, var(--warn) 30%, transparent); background: var(--warn-bg); color: var(--warn); padding: 10px 12px; font-size: 14px; }
  .alert svg { margin-top: 2px; } .alert .tx { color: var(--foreground); opacity: .85; }
  .alert.bad { border-color: color-mix(in oklch, var(--destructive) 30%, transparent); background: color-mix(in oklch, var(--destructive) 6%, transparent); color: var(--destructive); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--muted); border-radius: 4px; padding: 1px 5px; word-break: break-all; }
  .copy { cursor: pointer; border: 0; color: inherit; }
  .copy:hover { background: var(--accent); filter: brightness(.95); }

  /* 下拉菜单 */
  .menu { position: fixed; z-index: 50; min-width: 11rem; padding: 4px; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--border); background: var(--popover); color: var(--foreground); box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); animation: pop .12s ease-out; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; color: inherit; font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 4px; cursor: pointer; text-align: left; }
  .menu button:hover, .menu button:focus-visible { background: var(--accent); outline: none; }
  .menu button svg { color: var(--muted-foreground); }
  .menu button.danger { color: var(--destructive); } .menu button.danger svg { color: var(--destructive); }
  .menu button.danger:hover { background: color-mix(in oklch, var(--destructive) 10%, transparent); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px -4px; }
  .menu .lbl { font-size: 12px; color: var(--muted-foreground); padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }

  /* 对话框 */
  dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); color: var(--foreground); padding: 24px; width: calc(100% - 32px); max-width: 32rem; box-shadow: 0 25px 50px -12px rgb(0 0 0 / .25); }
  dialog[open] { animation: pop .15s ease-out; }
  dialog::backdrop { background: rgb(0 0 0 / .5); }
  dialog h3 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; }
  dialog .desc { margin: 8px 0 0; font-size: 14px; color: var(--muted-foreground); }
  dialog form { display: grid; gap: 16px; margin-top: 20px; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap-reverse; }
  dialog .x { position: absolute; top: 14px; right: 14px; }
  @media (max-width: 640px) { dialog .foot .btn { flex: 1; } }

  /* Toast（vue-sonner 风格，顶部居中） */
  #toasts { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 100; display: grid; gap: 8px; width: min(356px, calc(100% - 32px)); pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--popover); color: var(--foreground); font-size: 13px; box-shadow: 0 4px 12px rgb(0 0 0 / .1); animation: tin .25s ease-out; }
  .toast.ok svg { color: var(--ok); } .toast.err svg { color: var(--destructive); }
  .toast.out { opacity: 0; transform: translateY(-8px); transition: all .2s; }
  @keyframes tin { from { opacity: 0; transform: translateY(-12px); } }

  .fade-hide { display: none !important; }
  @media (max-width: 640px) { .hide-sm { display: none; } .item .side .btn.outline { width: 32px; padding: 0; } }
</style>
</head>
<body>
<header>
  <span class="logo" data-i="split"></span>
  <h1>反代后台</h1>
  <span class="sep hide-sm"></span>
  <span class="who mut hide-sm" id="who"></span>
  <div class="acts">
    <button class="btn ghost icon sm" id="theme" aria-label="切换深浅色" title="切换深浅色"></button>
    <button class="btn ghost icon sm" id="reload" aria-label="刷新" title="刷新"></button>
  </div>
</header>

<main>
  <section>
    <div class="sh">
      <div style="min-width:0">
        <h2>接入域名</h2>
        <p class="sub mut" id="stat"><span class="sk" style="width:180px;height:14px;display:inline-block"></span></p>
      </div>
      <button class="btn sm" id="addBtn"><span data-i="plus"></span><span>添加域名</span></button>
    </div>
    <div id="banner"></div>
    <div id="list"></div>
  </section>

  <section id="dnsHelp" class="fade-hide">
    <div><h2>DNS 设置</h2><p class="sub mut">在域名所在账号加一条 CNAME，开不开橙色云朵都可以。</p></div>
    <div class="list"><div class="item" style="min-height:0;flex-wrap:wrap;gap:8px 16px">
      <span class="mut" style="font-size:13px">类型</span><code>CNAME</code>
      <span class="mut" style="font-size:13px">名称</span><code>接入域名</code>
      <span class="mut" style="font-size:13px">目标</span><button class="copy" title="复制"><code id="cname"></code></button>
    </div></div>
  </section>
</main>

<!-- 添加 / 编辑 -->
<dialog id="dlg">
  <button class="btn ghost icon sm x" value="cancel" data-close aria-label="关闭"><span data-i="x"></span></button>
  <h3 id="dlgTitle">添加域名</h3>
  <p class="desc" id="dlgDesc">访问这个域名的请求会原样转发到目标 Worker。</p>
  <form id="form" method="dialog" novalidate>
    <label class="lb">接入域名<input class="input mono" id="fHost" placeholder="api.example.com" autocomplete="off" spellcheck="false" /></label>
    <label class="lb">目标 Worker
      <input class="input mono" id="fTarget" placeholder="https://name.sub.workers.dev" autocomplete="off" spellcheck="false" />
      <span class="hint">只支持 https，可以带路径前缀，例如 https://x.workers.dev/v1</span>
    </label>
    <label class="lb">备注<input class="input" id="fNote" placeholder="可选" maxlength="200" /></label>
    <div class="swrow"><div>启用<div class="hint">关闭后访问返回 503</div></div><label class="sw"><input type="checkbox" id="fEn" checked /><span></span></label></div>
    <div class="swrow"><div>改写 Cookie 域名<div class="hint">把上游 Set-Cookie 里的目标域名换成接入域名</div></div><label class="sw"><input type="checkbox" id="fCk" /><span></span></label></div>
    <div class="swrow" id="fBindRow"><div>同时绑定到 Pages<div class="hint">自动加进本项目的自定义域名</div></div><label class="sw"><input type="checkbox" id="fBind" checked /><span></span></label></div>
    <div class="foot">
      <button type="button" class="btn outline" data-close>取消</button>
      <button type="button" class="btn outline" id="fTest"><span data-i="zap"></span>测试</button>
      <button type="submit" class="btn" id="fSave">保存</button>
    </div>
  </form>
</dialog>

<!-- 确认 -->
<dialog id="cfm" style="max-width:28rem">
  <h3 id="cfmTitle"></h3>
  <p class="desc" id="cfmDesc"></p>
  <div class="foot" style="margin-top:20px">
    <button class="btn outline" data-close>取消</button>
    <button class="btn destructive" id="cfmOk">确定</button>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script>
// —— 图标（lucide，MioHub 用的同一套） ——
const ICONS = {
  split: '<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  unlink: '<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/><line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/><line x1="16" x2="16" y1="19" y2="22"/><line x1="19" x2="22" y1="16" y2="16"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
};
const svg = (n, cls = '') => `<svg class="i ${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach((e) => (e.outerHTML = svg(e.dataset.i)));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let ME = {}, ITEMS = [];

// —— 主题 ——
function paintTheme() { $('theme').innerHTML = svg(document.documentElement.classList.contains('dark') ? 'sun' : 'moon'); }
$('theme').onclick = () => { const d = document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', d ? 'dark' : 'light'); paintTheme(); };
paintTheme();
$('reload').innerHTML = svg('refresh');

// —— Toast ——
function toast(text, ok = true) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.innerHTML = svg(ok ? 'check' : 'alert') + `<span>${esc(text)}</span>`;
  $('toasts').prepend(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200); }, ok ? 3000 : 5000);
}

// —— API ——
async function api(path, opt = {}) {
  const r = await fetch('/api/' + path, { ...opt, headers: { 'content-type': 'application/json' }, credentials: 'same-origin' });
  const d = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}
async function busy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true;
  const ic = btn.querySelector('svg'); if (ic) ic.outerHTML = svg('refresh', 'spin'); else btn.insertAdjacentHTML('afterbegin', svg('refresh', 'spin'));
  try { return await fn(); } catch (e) { toast(e.message, false); } finally { btn.disabled = false; btn.innerHTML = html; }
}

// —— 下拉菜单 ——
let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
document.addEventListener('click', (e) => { if (openMenu && !openMenu.contains(e.target)) closeMenu(); }, true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
addEventListener('scroll', closeMenu, { passive: true }); addEventListener('resize', closeMenu);
function showMenu(anchor, label, entries) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="lbl">${esc(label)}</div>`;
  entries.forEach((en) => {
    if (en === '-') { m.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button'); b.setAttribute('role', 'menuitem');
    if (en.danger) b.className = 'danger';
    b.innerHTML = svg(en.icon) + esc(en.text);
    b.onclick = () => { closeMenu(); en.run(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + 4 + h > innerHeight - 8 ? r.top - h - 4 : r.bottom + 4) + 'px';
  openMenu = m; m.querySelector('button')?.focus();
}

// —— 对话框 ——
document.querySelectorAll('dialog').forEach((d) => {
  d.querySelectorAll('[data-close]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); d.close(); }));
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
});
function confirmBox(title, desc, okText, fn) {
  $('cfmTitle').textContent = title; $('cfmDesc').textContent = desc; $('cfmOk').textContent = okText;
  $('cfmOk').onclick = () => busy($('cfmOk'), async () => { await fn(); $('cfm').close(); });
  $('cfm').showModal();
}

let editing = null;
function openEditor(it) {
  editing = it || null;
  const r = it?.rule || {};
  $('dlgTitle').textContent = it ? (it.rule ? '编辑规则' : '设置反代') : '添加域名';
  $('dlgDesc').textContent = it ? it.host : '访问这个域名的请求会原样转发到目标 Worker。';
  $('fHost').value = it?.host || ''; $('fHost').disabled = !!it; $('fHost').closest('label').hidden = !!it;
  $('fTarget').value = r.target || ''; $('fNote').value = r.note || '';
  $('fEn').checked = it?.rule ? !!r.enabled : true; $('fCk').checked = !!r.rewriteCookies;
  $('fBindRow').hidden = !ME.cfApi || !!it?.domain; $('fBind').checked = true;
  ['fHost', 'fTarget'].forEach((id) => $(id).removeAttribute('aria-invalid'));
  $('dlg').showModal();
  setTimeout(() => (it ? $('fTarget') : $('fHost')).focus(), 30);
}
$('addBtn').onclick = () => openEditor(null);
$('fTest').onclick = () => busy($('fTest'), async () => {
  const d = await api('test', { method: 'POST', body: JSON.stringify({ target: $('fTarget').value }) });
  toast(`目标返回 HTTP ${d.status}，耗时 ${d.ms} ms`, d.status < 500);
});
$('form').onsubmit = (e) => {
  e.preventDefault();
  const host = (editing?.host || $('fHost').value).trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  const target = $('fTarget').value.trim();
  if (!host) { $('fHost').setAttribute('aria-invalid', 'true'); $('fHost').focus(); return; }
  if (!target) { $('fTarget').setAttribute('aria-invalid', 'true'); $('fTarget').focus(); return; }
  busy($('fSave'), async () => {
    await api('rules/' + encodeURIComponent(host), { method: 'PUT', body: JSON.stringify({ target, note: $('fNote').value, enabled: $('fEn').checked, rewriteCookies: $('fCk').checked }) });
    let msg = '已保存，约 1 分钟内全球生效';
    if (!$('fBindRow').hidden && $('fBind').checked) {
      try { await api('domains', { method: 'POST', body: JSON.stringify({ name: host }) }); msg = '已保存并绑定，记得加 DNS 记录'; }
      catch (err) { if (!/already/i.test(err.message)) { toast('规则已保存，但绑定 Pages 失败：' + err.message, false); msg = ''; } }
    }
    $('dlg').close(); if (msg) toast(msg); load();
  });
};

// —— 列表 ——
function domainState(d) {
  if (!ME.cfApi) return null;
  if (!d) return { cls: 'bad', text: '未绑定' };
  if (d.status === 'active') return { cls: 'ok', text: '已生效' };
  if (d.status === 'pending' || d.status === 'initializing') return { cls: 'warn', text: '等待验证' };
  return { cls: 'bad', text: d.status };
}
function rowEl(it) {
  const r = it.rule, st = domainState(it.domain);
  const el = document.createElement('div');
  el.className = 'item' + (r && !r.enabled ? ' off' : '');
  const err = it.domain?.verification_data?.error_message || it.domain?.validation_data?.error_message || '';
  el.innerHTML = `
    <span class="fav">${esc(it.host.replace(/^www\./, '')[0] || '?')}</span>
    <div class="body">
      <div class="host"><b class="mono">${esc(it.host)}</b>
        ${st && st.cls !== 'ok' ? `<span class="badge ${st.cls}" title="${esc(err)}"><span class="dot ${st.cls}"></span>${esc(st.text)}</span>` : ''}
        ${r && !r.enabled ? '<span class="badge">已停用</span>' : ''}
      </div>
      <div class="meta">${r ? svg('arrow') + `<span class="t mono">${esc(r.target.replace(/^https:\/\//, ''))}</span>${r.note ? `<span class="hide-sm">· ${esc(r.note)}</span>` : ''}` : '<span class="t">还没有反代规则</span>'}</div>
    </div>
    <div class="side">
      ${r ? `<label class="sw" title="${r.enabled ? '停用' : '启用'}"><input type="checkbox" ${r.enabled ? 'checked' : ''} aria-label="启用 ${esc(it.host)}" /><span></span></label>` : `<button class="btn outline sm" data-act="set">${svg('plus')}<span class="hide-sm">设置</span></button>`}
      <button class="btn ghost icon sm" data-act="more" aria-label="更多操作">${svg('more')}</button>
    </div>`;
  const sw = el.querySelector('.sw input');
  if (sw) sw.onchange = async () => {
    try { await api('rules/' + encodeURIComponent(it.host), { method: 'PUT', body: JSON.stringify({ ...r, enabled: sw.checked }) }); toast(sw.checked ? `已启用 ${it.host}` : `已停用 ${it.host}`); load(); }
    catch (e) { sw.checked = !sw.checked; toast(e.message, false); }
  };
  el.querySelector('[data-act=set]')?.addEventListener('click', () => openEditor(it));
  el.querySelector('[data-act=more]').onclick = (e) => {
    const en = [{ icon: 'pencil', text: r ? '编辑规则' : '设置反代', run: () => openEditor(it) }];
    en.push({ icon: 'ext', text: '打开网站', run: () => open('https://' + it.host, '_blank', 'noopener') });
    if (r) en.push({ icon: 'zap', text: '测试目标', run: async () => { try { const d = await api('test', { method: 'POST', body: JSON.stringify({ target: r.target }) }); toast(`目标返回 HTTP ${d.status}，耗时 ${d.ms} ms`, d.status < 500); } catch (er) { toast(er.message, false); } } });
    if (ME.cfApi && !it.domain) en.push({ icon: 'link', text: '绑定到 Pages', run: async () => { try { await api('domains', { method: 'POST', body: JSON.stringify({ name: it.host }) }); toast('已提交绑定，记得加 DNS 记录'); load(); } catch (er) { toast(er.message, false); } } });
    if (r || (ME.cfApi && it.domain)) en.push('-');
    if (r) en.push({ icon: 'trash', text: '删除规则', danger: true, run: () => confirmBox('删除反代规则？', `${it.host} 将返回 404，域名绑定保留。`, '删除', async () => { await api('rules/' + encodeURIComponent(it.host), { method: 'DELETE' }); toast('规则已删除'); load(); }) });
    if (ME.cfApi && it.domain) en.push({ icon: 'unlink', text: '解绑域名', danger: true, run: () => confirmBox('从 Pages 解绑？', `解绑后 ${it.host} 将无法访问，规则保留。`, '解绑', async () => { await api('domains/' + encodeURIComponent(it.host), { method: 'DELETE' }); toast('已解绑'); load(); }) });
    showMenu(e.currentTarget, it.host, en);
  };
  return el;
}
function render() {
  const list = $('list'); list.innerHTML = '';
  const active = ITEMS.filter((x) => x.rule?.enabled).length;
  const pending = ME.cfApi ? ITEMS.filter((x) => x.domain && x.domain.status !== 'active').length : 0;
  $('stat').innerHTML = `<span class="tab">${ITEMS.length} 个域名</span><span style="display:inline-flex;align-items:center;gap:6px"><span class="dot ok"></span><span class="tab">${active} 个在转发</span></span>${pending ? `<span style="display:inline-flex;align-items:center;gap:6px"><span class="dot warn"></span><span class="tab">${pending} 个等待验证</span></span>` : ''}`;
  if (!ITEMS.length) {
    list.innerHTML = `<div class="empty"><span class="ico">${svg('globe')}</span><h3>还没有接入的域名</h3><p class="mut">添加一个域名并填上目标 Worker，访问这个域名就会转发过去。</p><button class="btn sm" style="margin-top:8px" id="emptyAdd">${svg('plus')}添加域名</button></div>`;
    $('emptyAdd').onclick = () => openEditor(null);
    return;
  }
  const box = document.createElement('div'); box.className = 'list';
  ITEMS.forEach((it) => box.appendChild(rowEl(it)));
  list.appendChild(box);
}
function skeleton() {
  $('list').innerHTML = '<div class="list">' + [0, 1, 2].map(() => '<div class="item"><span class="sk" style="width:32px;height:32px;border-radius:8px"></span><div class="body"><span class="sk" style="width:40%;height:14px"></span><span class="sk" style="width:60%;height:12px"></span></div></div>').join('') + '</div>';
}
async function load() {
  const rb = $('reload'); rb.querySelector('svg').classList.add('spin');
  try {
    ME = await api('me');
    $('who').textContent = ME.email + (ME.project ? ` · ${ME.project}` : '');
    if (ME.cname) { $('cname').textContent = ME.cname; $('dnsHelp').classList.remove('fade-hide'); }
    $('banner').innerHTML = ME.cfApi ? '' : `<div class="alert">${svg('alert')}<span class="tx">没有配置 Cloudflare API（CF_ACCOUNT_ID / CF_API_TOKEN / PAGES_PROJECT），看不到绑定状态，域名需要到面板手动加进 Pages 自定义域名。</span></div>`;
    const d = await api('overview');
    ITEMS = d.items; render();
  } catch (e) {
    $('stat').textContent = '';
    $('list').innerHTML = `<div class="alert bad">${svg('alert')}<span class="tx">${esc(e.message)}</span></div>`;
  } finally { rb.querySelector('svg')?.classList.remove('spin'); }
}
$('reload').onclick = load;
document.querySelector('#dnsHelp .copy').onclick = async () => { try { await navigator.clipboard.writeText(ME.cname); toast('已复制'); } catch { toast('复制失败', false); } };
skeleton(); load();
</script>
</body>
</html>
